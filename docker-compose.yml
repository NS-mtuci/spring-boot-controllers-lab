services:
  postgres:
    image: postgres:17
    container_name: airline-lab-postgres
    environment:
      POSTGRES_DB: airline_lab
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
